<body>

<h1>3×81 · Kernel · Matrix · Orbit · Z‑Axis · InfinityCross</h1>

<script type="module">

    import { Kernel3x81 } from "./JS/381.kernel.js";

    import { _81tmp_matrix } from "./JS/81tmp.matrix.js";
    import { InfinityCross } from "./JS/InfinityCross.js";

    async function start() {

        // 1. Kernel laden

        // 2. Orbit24D anzeigen
        document.body.innerHTML += "<pre>Orbit24D:\n" +

        document.body.innerHTML += "<pre>Z‑Axis:\n" +

            "</pre>";

        // 4. 81tmp‑Matrix anzeigen
        const matrix = await _81tmp_matrix();
        document.body.innerHTML += "<pre>81tmp‑Matrix:\n" +
            JSON.stringify(matrix, null, 2) +
            "</pre>";

        // 5. InfinityCross anzeigen
        document.body.innerHTML += "<pre>InfinityCross:\n" +
            InfinityCross() +
            "</pre>";

    start();

</script>
