<script type="module">
import { Kernel3x81 } from "./JS/3x81.kernel.js";
import { AtomRings4D } from "./JS/AtomRings4D.js";
import { Orbit24D } from "./JS/Orbit24D.js";
import { Z_Axis } from "./JS/Z.axis.js";
import { _81tmp_matrix } from "./JS/81tmp.matrix.js";
import { InfinityCross } from "./JS/InfinityCross.js";

async function start() {
    const atom = await Kernel3x81();

    document.body.innerHTML += AtomRings4D();
    document.body.innerHTML += "<pre>" + JSON.stringify(Orbit24D(atom), null, 2) + "</pre>";
    document.body.innerHTML += "<pre>" + JSON.stringify(Z_Axis(atom), null, 2) + "</pre>";
    document.body.innerHTML += "<pre>" + JSON.stringify(await _81tmp_matrix(), null, 2) + "</pre>";
    document.body.innerHTML += "<pre>" + InfinityCross() + "</pre>";
}

start();
</script>
